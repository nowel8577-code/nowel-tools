<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>〈師說〉百萬大富翁</title>
<meta name="theme-color" content="#0b1640">
<style>
  :root{
    --bg:#0b1640; --bg2:#13235e; --gold:#f4c84a; --gold2:#ffe79a; --ink:#f3f5ff; --dim:#9aa6d6;
    --ok:#2fa45a; --no:#c8372d; --sel:#e98a1b;
    --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--serif);
    background:radial-gradient(ellipse at 50% 0%,#24398f 0%,var(--bg) 60%) fixed}
  body{min-height:100vh;padding:16px;display:flex;justify-content:center}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{width:min(1100px,100%)}
  h1{margin:6px 0;text-align:center;color:var(--gold);font-size:clamp(26px,5vw,44px);letter-spacing:3px;text-shadow:0 0 18px rgba(244,200,74,.4)}
  .sub{text-align:center;color:var(--dim);font-size:15px;margin:4px 0}
  .panel{background:rgba(10,20,70,.75);border:2px solid #3b55b8;border-radius:16px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .row{display:flex;gap:10px;margin:14px 0}
  .row>*{flex:1}
  label{font-size:14px;color:var(--dim);display:block;margin-bottom:4px}
  input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid #3b55b8;border-radius:8px;background:#0d1a4e;color:var(--ink)}
  .big{display:block;width:100%;padding:14px;border:2px solid var(--gold);border-radius:40px;background:linear-gradient(#f9d86a,#d9a227);color:#2a1a00;font-size:20px;font-weight:900;margin-top:12px;letter-spacing:2px}
  .big:disabled{opacity:.4}
  .rules{line-height:1.8;font-size:16px;margin:12px 0 0;padding-left:20px}
  .rules b{color:var(--gold)}
  .game{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start}
  @media (max-width:760px){.game{grid-template-columns:1fr}.ladder{order:-1;padding:6px}.ladder li:not(.now){display:none}}
  .life{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .life button{border:2px solid var(--gold);background:#0d1a4e;border-radius:30px;padding:8px 14px;font-size:15px;font-weight:700}
  .life button:disabled{opacity:.3;text-decoration:line-through}
  .q{background:linear-gradient(90deg,#0d1a4e,#1b2f7a,#0d1a4e);border:2px solid var(--gold);border-radius:40px;padding:18px 26px;font-size:clamp(19px,2.6vw,26px);line-height:1.6;text-align:center;margin-bottom:14px}
  .q em{font-style:normal;color:var(--gold2);border-bottom:2px solid var(--gold)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{text-align:left;padding:14px 20px;border:2px solid #5a74d6;border-radius:40px;background:#0d1a4e;font-size:clamp(17px,2.2vw,21px);transition:background .2s}
  .opt b{color:var(--gold);margin-right:8px}
  .opt.sel{background:var(--sel);border-color:#ffd08a}
  .opt.ok{background:var(--ok);border-color:#9ff0b8}
  .opt.no{background:var(--no);border-color:#ffb1a8}
  .opt.gone{visibility:hidden}
  .note{margin-top:14px;padding:14px 18px;border-left:5px solid var(--gold);background:rgba(13,26,78,.9);border-radius:8px;font-size:18px;line-height:1.7}
  .note b{color:var(--gold2)}
  .act{display:flex;gap:10px;margin-top:12px}
  .act .big{margin-top:0}
  .ghost{background:transparent;color:var(--gold);}
  .ladder{list-style:none;margin:0;padding:10px;background:rgba(10,20,70,.75);border:2px solid #3b55b8;border-radius:14px;display:flex;flex-direction:column-reverse;gap:2px}
  .ladder li{display:flex;justify-content:space-between;padding:4px 10px;border-radius:6px;font-size:15px;color:var(--dim)}
  .ladder li.safe{color:#fff;font-weight:700}
  .ladder li.done{color:var(--gold)}
  .ladder li.now{background:var(--sel);color:#fff;font-weight:900}
  .score{font-size:clamp(40px,8vw,64px);font-weight:900;color:var(--gold);text-align:center;margin:8px 0}
  .review{font-size:16px;line-height:1.7}
  .review li{margin:6px 0}
  .review span{color:var(--gold2)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .overlay .panel{width:min(560px,100%);font-size:19px;line-height:1.8}
  .overlay h2{margin:0 0 8px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">

  <section id="start" class="panel">
    <h1>〈師說〉百萬大富翁</h1>
    <p class="sub">第一～三段・15 題・答對一路晉級到一百萬</p>
    <ul class="rules">
      <li>每題四選一，選好後按<b>「確定答案」</b>才算數。</li>
      <li>第 5 題（1 萬）和第 10 題（32 萬）是<b>保底關卡</b>，答錯會退回最近的保底。</li>
      <li>三個救命錦囊各用一次：<b>50:50</b> 刪掉兩個錯的、<b>全班舉手</b> 讓全班投票、<b>請教韓愈</b> 看提示。</li>
      <li>任何時候都可以<b>「帶著獎金離開」</b>。答錯後仍可以繼續練完全部題目，但獎金不再增加。</li>
    </ul>
    <div class="row">
      <div><label for="cls">班級代號</label><input id="cls" type="text" inputmode="numeric" placeholder="例：101" maxlength="6"></div>
      <div><label for="seat">座號或組別</label><input id="seat" type="text" placeholder="例：12 或 第3組" maxlength="6"></div>
    </div>
    <button class="big" id="go" disabled>開始挑戰</button>
    <p class="sub">投影全班玩時，班級填班級代號、座號欄填「全班」即可。</p>
  </section>

  <section id="play" hidden>
    <div class="game">
      <div>
        <div class="life">
          <button id="l50">50:50</button>
          <button id="lvote">全班舉手</button>
          <button id="lhint">請教韓愈</button>
          <button id="lquit">帶著獎金離開</button>
        </div>
        <div class="q" id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div class="note" id="note" hidden></div>
        <div class="act">
          <button class="big" id="lock" disabled>確定答案</button>
          <button class="big" id="next" hidden>下一題</button>
        </div>
      </div>
      <ol class="ladder" id="ladder"></ol>
    </div>
  </section>

  <section id="end" class="panel" hidden>
    <h1 id="endt">挑戰結束</h1>
    <p class="sub" id="who"></p>
    <div class="score" id="prize"></div>
    <p class="sub" id="stat"></p>
    <ol class="review" id="review"></ol>
    <button class="big" id="again">再玩一次</button>
    <p class="sub" id="stamp"></p>
  </section>

</div>

<div class="overlay" id="ov" hidden><div class="panel"><h2 id="ovt"></h2><div id="ovb"></div><button class="big" id="ovx">知道了</button></div></div>

<script>
const PRIZE=[100,500,1000,5000,10000,20000,40000,80000,160000,320000,400000,500000,640000,800000,1000000];
// 0-based：第 5 題、第 10 題為保底
const SAFE=[4,9];
const fmt=n=>n>=10000?(n/10000)+' 萬':n+' 元';
// [題目, 選項, 正解索引, 詳解, 韓愈提示]
const QS=[
 ['「師者，所以傳道、受業、解惑也」，老師有哪三種作用？',['傳道、受業、解惑','讀書、寫字、算數','修身、齊家、治國','聽講、作業、考試'],0,'第一段開宗明義：老師的職責是<b>傳道、受業、解惑</b>。','答案就在題目引的那一句裡。'],
 ['「人非生而知之者，<em>孰</em>能無惑」的「孰」是？',['熟悉','誰','什麼','怎麼'],1,'「孰」解作<b>誰</b>。誰能沒有疑惑？答案在反面：人人都有疑惑。','把它換成白話的疑問代名詞「＿能沒有疑惑」。'],
 ['「師者，<em>所以</em>傳道、受業、解惑也」的「所以」是？',['因此','用來','……的原因','所有的'],1,'表示用途，解作<b>用來</b>。','不是今天的「因此」，是在說老師「拿來做什麼」。'],
 ['「其聞道也，<em>固</em>先乎吾」的「固」是？',['堅固','固執','本來','鞏固'],2,'「固」解作<b>本來</b>。比我先出生的人，本來就比我先聽聞道理。','比我早出生的人，＿＿就比我早懂。'],
 ['韓愈選擇老師的標準是？',['年紀比我大','地位比我高','道之所存，師之所存','名聲響亮'],2,'<b>道之所存，師之所存</b>：誰先懂得道理，誰就是老師，與貴賤、長少無關。','第二段最後一句就是答案。'],
 ['「吾從而<em>師</em>之」的「師」是？',['名詞，老師','動詞，學習、拜他為師','形容詞，專業的','名詞，軍隊'],1,'名詞轉作動詞（轉品），解作<b>學習、拜他為師</b>。','它前面有「從而」，後面接受詞「之」，所以是動作。'],
 ['「人非生而知之者，孰能無惑？」用了哪一種修辭？',['激問','提問','譬喻','誇飾'],0,'<b>激問</b>：答案在問題的反面，肯定「人人都有疑惑」。','問句裡藏著相反的肯定答案。'],
 ['「夫<em>庸</em>知其年之先後生於吾乎」的「庸」是？',['平庸','雇用','豈、難道','用來'],2,'「庸」解作<b>豈、難道</b>，反問語氣。','句尾有「乎」，整句是在反問。'],
 ['「無貴、無賤、無長、無少」用了哪些修辭？',['頂真','類疊、排比','回文','映襯、倒裝'],1,'「無」字重複是<b>類疊</b>，四個結構相同的短句並列是<b>排比</b>。','同一個字一再出現，句子長得一樣。'],
 ['「今之眾人……而<em>恥</em>學於師」的「恥」是？',['羞辱別人','以……為恥','恥辱的事','不知羞恥'],1,'意動用法，<b>以向老師學習為恥</b>。','他們覺得「向老師學」這件事很丟臉。'],
 ['老師的三種作用中，韓愈最重視哪一個？',['傳道','受業','解惑','三者一樣重要'],2,'第一段談完三種作用，只接著論「孰能無惑」「惑而不從師，其為惑也終不解矣」，可見最重視<b>解惑</b>。','看第一段後半，他只繼續討論了哪一項？'],
 ['「古之聖人，其<em>出</em>人也遠矣」的「出」是？',['離開','出現','超出','出生'],2,'「出」解作<b>超出</b>。聖人超出一般人很遠，卻還是從師問學。','跟後面「其下聖人也亦遠矣」的「下」相對。'],
 ['「古之聖人……猶且從師而問焉；今之眾人……而恥學於師」用了什麼寫法？',['古今對比（映襯）','由小到大（層遞）','以物喻人（譬喻）','前後呼應（頂真）'],0,'古聖人「從師問學」對比今眾人「恥學於師」，是<b>古今縱向對比</b>，修辭為<b>映襯</b>。','一古一今、一好一壞，擺在一起比。'],
 ['「是故聖<em>益</em>聖，愚益愚」的「益」是？',['利益','更加','幫助','增加財富'],1,'「益」解作<b>更加</b>。聖人更加聖明，愚人更加愚昧。','聖人越來越聖明，愚人越來越愚昧。'],
 ['「聖人之所以為聖，愚人之所以為愚，其皆出於<em>此</em>乎」的「此」指什麼？',['聖人天生聰明','是否從師問學','讀書多寡','年紀大小'],1,'「此」指<b>是否從師問學</b>。聖愚的差別，來自願不願意向老師學習。','回頭看前一句：聖人做了什麼，眾人不肯做什麼？']
];
const $=id=>document.getElementById(id);
let i=0,pick=-1,bank=0,out=false,right=0,wrong=[],used={},t0=0;

function check(){ $('go').disabled=!($('cls').value.trim()&&$('seat').value.trim()); }
$('cls').oninput=check; $('seat').oninput=check;

function ladder(){
  $('ladder').innerHTML=PRIZE.map((p,k)=>`<li class="${SAFE.includes(k)?'safe ':''}${k<i?'done ':''}${k===i&&!out?'now':''}"><span>${k+1}</span><span>${fmt(p)}</span></li>`).join('');
}
$('go').onclick=()=>{
  i=0;bank=0;out=false;right=0;wrong=[];used={};t0=Date.now();
  ['l50','lvote','lhint','lquit'].forEach(id=>$(id).disabled=false);
  $('start').hidden=true;$('end').hidden=true;$('play').hidden=false;show();
};
$('again').onclick=()=>{ $('end').hidden=true;$('start').hidden=false; };

function show(){
  const Q=QS[i];pick=-1;
  $('qtext').innerHTML=`第 ${i+1} 題${out?'（練習）':'・'+fmt(PRIZE[i])}<br>`+Q[0];
  $('note').hidden=true;$('next').hidden=true;$('lock').hidden=false;$('lock').disabled=true;
  const box=$('opts');box.innerHTML='';
  Q[1].forEach((o,k)=>{
    const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[k]}</b>${o}`;
    b.onclick=()=>{ if(b.disabled)return; [...box.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); pick=k; $('lock').disabled=false; };
    box.appendChild(b);
  });
  ladder(); window.scrollTo(0,0);
}
$('lock').onclick=()=>{
  if(pick<0)return;
  const Q=QS[i],bs=[...$('opts').children];
  bs.forEach(b=>b.disabled=true);
  bs[Q[2]].classList.add('ok');
  let msg;
  if(pick===Q[2]){
    right++; if(!out) bank=PRIZE[i];
    msg=`✔ 答對！${out?'':'獎金來到 <b>'+fmt(bank)+'</b>。'}<br>`+Q[3];
  }else{
    bs[pick].classList.add('no'); wrong.push(Q);
    if(!out){
      out=true; const s=SAFE.filter(k=>k<i).pop(); bank=s===undefined?0:PRIZE[s];
      msg=`✘ 答錯了，正確答案是 ${'ABCD'[Q[2]]}。獎金退回保底 <b>${fmt(bank)}</b>，接下來的題目當練習。<br>`+Q[3];
      ['l50','lvote','lhint','lquit'].forEach(id=>$(id).disabled=true);
    }else msg=`✘ 正確答案是 ${'ABCD'[Q[2]]}。<br>`+Q[3];
  }
  $('note').innerHTML=msg;$('note').hidden=false;
  $('lock').hidden=true;
  $('next').textContent=i===QS.length-1?'看結果':'下一題';$('next').hidden=false;
  if(i===QS.length-1&&!out) bank=PRIZE[i];
};
$('next').onclick=()=>{ if(i===QS.length-1) return finish(); i++; show(); };

$('l50').onclick=()=>{
  const Q=QS[i],bs=[...$('opts').children];
  const wrongs=[0,1,2,3].filter(k=>k!==Q[2]).sort(()=>Math.random()-.5).slice(0,2);
  wrongs.forEach(k=>{bs[k].classList.add('gone');bs[k].disabled=true;bs[k].classList.remove('sel'); if(pick===k){pick=-1;$('lock').disabled=true;}});
  $('l50').disabled=true;
};
$('lvote').onclick=()=>{ $('lvote').disabled=true; pop('全班舉手','老師依序唸 A、B、C、D，全班舉手投票。<br>挑戰者看完票數，再自己決定要不要相信大家。'); };
$('lhint').onclick=()=>{ $('lhint').disabled=true; pop('韓愈說：',QS[i][4]); };
$('lquit').onclick=()=>{ out=true; finish(true); };
function pop(t,b){ $('ovt').textContent=t;$('ovb').innerHTML=b;$('ov').hidden=false; }
$('ovx').onclick=()=>$('ov').hidden=true;

function finish(quit){
  const sec=Math.round((Date.now()-t0)/1000);
  $('play').hidden=true;$('end').hidden=false;
  $('endt').textContent=quit?'帶著獎金離開':(right===QS.length?'恭喜成為百萬富翁！':'挑戰結束');
  $('who').textContent=`${$('cls').value.trim()} 班　${$('seat').value.trim()}`;
  $('prize').textContent=fmt(bank);
  $('stat').textContent=`作答 ${quit?i:QS.length} 題，答對 ${right} 題，用時 ${Math.floor(sec/60)} 分 ${sec%60} 秒`;
  $('review').innerHTML=wrong.length?wrong.map(Q=>`<li>${Q[0]}<br><span>答案：${Q[1][Q[2]]}</span></li>`).join(''):'';
  $('stamp').textContent='完成時間：'+new Date().toLocaleString('zh-TW');
  window.scrollTo(0,0);
}
</script>
</body>
</html>

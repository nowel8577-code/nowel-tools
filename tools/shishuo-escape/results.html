<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>〈師說〉密室逃脫｜各組成績</title>
<style>
  :root{--ink:#3b2f24;--paper:#f6ecd3;--paper2:#e8d9b5;--red:#8a2a1e;--gold:#c9a24a;
    --serif:"Noto Serif TC","Microsoft JhengHei","PMingLiU",serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--serif);color:var(--ink);background:#efe3c6;padding:24px 16px}
  main{max-width:960px;margin:0 auto}
  h1{color:var(--red);margin:0 0 4px;letter-spacing:2px}
  .sub{margin:0 0 16px;opacity:.75}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  select,button{font:inherit;font-size:16px;padding:8px 12px;border:2px solid var(--paper2);border-radius:8px;background:#fffaf0;color:var(--ink)}
  .stat{margin-left:auto;font-weight:700}
  table{width:100%;border-collapse:collapse;background:#fffaf0;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--paper2)}
  th{background:var(--red);color:#fff;font-weight:700}
  td.rank{font-size:22px}
  tr.top td{background:#fff3cf;font-weight:700}
  .empty{padding:40px;text-align:center;opacity:.7}
  .note{font-size:13px;opacity:.7;margin-top:12px;line-height:1.7}
  .err{color:#b3342a;font-weight:700}
  @media (max-width:600px){th:nth-child(7),td:nth-child(7){display:none}}
</style>
</head>
<body>
<main>
  <h1>〈師說〉密室逃脫｜各組成績</h1>
  <p class="sub">學生逃出書房時會自動送出成績，這頁會即時更新。排名依用時，用時相同比答錯次數。</p>
  <div class="bar">
    <select id="day" aria-label="日期"><option value="today">只看今天</option><option value="all">全部日期</option></select>
    <select id="cls" aria-label="班級"><option value="">全部班級</option></select>
    <span class="stat" id="stat">讀取中……</span>
  </div>
  <table>
    <thead><tr><th>名次</th><th>班級</th><th>組別</th><th>用時</th><th>答錯</th><th>提示</th><th>完成時間</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">讀取中……</td></tr></tbody>
  </table>
  <p class="note">同一組重玩多次時，只列最好的一次。資料存在 nowel-tools 的 Firebase（game_scores，標記 game = shishuo-escape），只有班級代號與組別，沒有學生個資。</p>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, query, where }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const db = getFirestore(initializeApp({
  apiKey: 'AIzaSyBMTe5eLI3GKmLz6beXvfnaBgQaXJsr-xM',
  authDomain: 'my-teaching-tools-b8e86.firebaseapp.com',
  projectId: 'my-teaching-tools-b8e86',
  storageBucket: 'my-teaching-tools-b8e86.firebasestorage.app',
  messagingSenderId: '47224328529',
  appId: '1:47224328529:web:6e6f761ff6b455f9db0370'
}));

let all = [];
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function render() {
  const today = new Date().toDateString();
  const cls = $('#cls').value;
  const rows = all.filter((d) => ($('#day').value === 'all' || d.when.toDateString() === today) && (!cls || d.class_name === cls));
  const best = {};
  rows.forEach((d) => {
    const k = `${d.class_name}-${d.group}`;
    const b = best[k];
    if (!b || d.time_sec < b.time_sec || (d.time_sec === b.time_sec && d.errors < b.errors)) best[k] = d;
  });
  const ranked = Object.values(best).sort((a, b) => a.time_sec - b.time_sec || a.errors - b.errors);
  $('#stat').textContent = `${ranked.length} 組完成`;
  const medals = ['🥇', '🥈', '🥉'];
  $('#rows').innerHTML = ranked.length
    ? ranked.map((d, i) => `<tr class="${i < 3 ? 'top' : ''}">
        <td class="rank">${medals[i] || i + 1}</td><td>${esc(d.class_name)}</td><td>第 ${esc(d.group)} 組</td>
        <td>${fmt(d.time_sec)}</td><td>${esc(d.errors)}</td><td>${esc(d.hints)}</td>
        <td>${d.when.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}${$('#day').value === 'all' ? '<br><small>' + d.when.toLocaleDateString('zh-TW') + '</small>' : ''}</td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">還沒有組別逃出書房</td></tr>';
}

function refreshClasses() {
  const sel = $('#cls');
  const cur = sel.value;
  const names = [...new Set(all.map((d) => d.class_name))].sort();
  sel.innerHTML = '<option value="">全部班級</option>' + names.map((n) => `<option>${esc(n)}</option>`).join('');
  sel.value = names.includes(cur) ? cur : '';
}

onSnapshot(
  query(collection(db, 'game_scores'), where('game', '==', 'shishuo-escape')),
  (snap) => {
    all = snap.docs.map((d) => {
      const v = d.data();
      return { ...v, when: v.created_at ? v.created_at.toDate() : new Date() };
    });
    refreshClasses();
    render();
  },
  (err) => {
    $('#stat').innerHTML = '<span class="err">讀取失敗</span>';
    $('#rows').innerHTML = `<tr><td colspan="7" class="empty err">無法讀取成績：${esc(err.message)}</td></tr>`;
  }
);
$('#day').onchange = render;
$('#cls').onchange = render;
</script>
</body>
</html>
